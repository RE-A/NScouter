# Scouter Host Agent
#
# 자바 에이전트(agent/*.conf)와 달리 JVM 이 아니라 **머신 지표**를 수집한다.
# CPU / Memory / Swap / Net / Disk — counters.xml 의 host Family 24개가 여기서 나온다.
#
# 컨테이너 안에서 돌지만 /proc 은 네임스페이스로 격리되지 않아
# sigar 가 읽는 값은 **컨테이너가 아니라 podman VM 의 것**이다.
# 이 테스트 환경에서 "호스트"란 곧 그 VM 을 말한다.

# 오브젝트 식별.
# obj_type 을 자바 에이전트(tomcat)와 반드시 다르게 둔다 —
# 카운터는 Family 단위라 tomcat 오브젝트에 Cpu 를 물으면 에러 없이 0건이 온다.
obj_name=test-host
obj_type=linux

# 콜렉터 접속
net_collector_ip=scouter-collector
net_collector_tcp_port=6100
net_collector_udp_port=6100
