<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 등록/수정 - shop-app</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        label { display: block; margin-top: .75rem; }
    </style>
</head>
<body>
<h1 th:text="${product} == null ? '상품 등록' : '상품 수정'">상품 등록</h1>
<form th:action="${product} == null ? '/shop/products' : '/shop/products/' + ${product.id} + '/edit'"
      method="post">
    <label>이름
        <input type="text" name="name" th:value="${product} == null ? '' : ${product.name}" required>
    </label>
    <label>분류
        <input type="text" name="category" th:value="${product} == null ? 'etc' : ${product.category}" required>
    </label>
    <label>가격
        <input type="number" name="price" th:value="${product} == null ? 1000 : ${product.price}" required>
    </label>
    <p><button type="submit">저장</button> <a href="/shop/products">취소</a></p>
</form>
</body>
</html>
