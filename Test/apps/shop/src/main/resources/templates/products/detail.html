<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' - shop-app'">상품 상세</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        dt { font-weight: bold; margin-top: .5rem; }
    </style>
</head>
<body>
<h1 th:text="${product.name}">상품</h1>
<dl>
    <dt>ID</dt><dd th:text="${product.id}">1</dd>
    <dt>분류</dt><dd th:text="${product.category}">분류</dd>
    <dt>가격</dt><dd th:text="${product.price}">0</dd>
    <dt>등록일시</dt><dd th:text="${product.createdAt}">-</dd>
</dl>
<p>
    <a th:href="@{'/shop/products/' + ${product.id} + '/edit'}">수정</a>
    <a href="/shop/products">목록</a>
</p>
</body>
</html>
