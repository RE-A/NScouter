<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 생성 - order-app</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        label { display: block; margin-top: .75rem; }
    </style>
</head>
<body>
<h1>주문 생성</h1>
<p>저장 전에 shop-app 의 <code>/shop/api/products/{id}</code> 를 호출해 상품 정보를 가져온다.</p>
<form action="/order/orders" method="post">
    <label>상품 ID
        <input type="number" name="productId" value="1" required>
    </label>
    <label>수량
        <input type="number" name="quantity" value="1" required>
    </label>
    <p><button type="submit">주문</button> <a href="/order/orders">취소</a></p>
</form>
</body>
</html>
