# Scouter Java Agent — order-app
# 키 이름은 javap 로 scouter.agent.Configure 의 public 필드를 확인한 것만 사용한다.

# 오브젝트 식별 (NScouter 에이전트 목록 / XLog 점 색상의 기준)
obj_name=order-app
obj_type=tomcat
obj_name_auto_pid_enabled=false

# 콜렉터 접속
net_collector_ip=scouter-collector
net_collector_tcp_port=6100
net_collector_udp_port=6100

# XLog 전송
xlog_lower_bound_time_ms=0
xlog_sampling_enabled=false

# 프로파일
profile_off=false
profile_step_max_count=1024
profile_connection_open_enabled=true
profile_fullstack_service_error_enabled=true
profile_fullstack_sql_error_enabled=true
profile_fullstack_apicall_error_enabled=true

# 메서드 프로파일 — shop 호출 경로가 보이도록 서비스 계층 후킹
hook_method_patterns=com.nscouter.test.order.service.*,com.nscouter.test.order.repository.*

# JDBC 후킹 설정 없음 — PostgreSQL 은 Scouter 기본 후킹 대상이다 (shop.conf 참조)

# 분산 트랜잭션 전파 (gxid / caller) — shop-app 호출 시 헤더로 전파된다
trace_interservice_enabled=true
trace_response_gxid_enabled=true

# 성능 카운터
counter_enabled=true

# 인터랙션(토폴로지) 수집. 기본값이 꺼짐이라 켜야 호출 관계가 쌓인다 (F-40)
counter_interaction_enabled=true

# JMX 카운터. datasource(ConnActive/ConnIdle/ConnMax)는 HikariCP MBean 을 읽어
# tomcat_ds 서브오브젝트로 올린다. 기본값이 꺼짐이라 켜야 한다.
jmx_counter_enabled=true
