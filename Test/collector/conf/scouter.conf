# Scouter Collector 설정 (NScouter 테스트 환경)
# 키 이름은 scouter.server.Configure 클래스의 public 필드에서 확인한 것만 사용한다.

server_id=NSCOUTER-TEST

# 클라이언트(NScouter) / 에이전트 통신
net_tcp_listen_ip=0.0.0.0
net_tcp_listen_port=6100

# 에이전트 성능 메트릭 수집
net_udp_listen_ip=0.0.0.0
net_udp_listen_port=6100

# 내장 Jetty(기본 6180)는 NScouter가 쓰지 않는다.
# 주의: 아래 두 값을 false로 두어도 실제로는 Jetty가 6180에 뜬다(실측). 다만 호스트로
#       퍼블리시하지 않으므로 외부 노출은 없다.
net_http_server_enabled=false
net_http_api_enabled=false

# 데이터 / 로그 경로
db_dir=/data/database
log_dir=/data/logs

# 실시간 XLog 전송 하한. 0이어야 빠른 트랜잭션도 스캐터에 표시된다.
xlog_realtime_lower_bound_ms=0
xlog_pasttime_lower_bound_ms=0

# 테스트 환경이므로 보관 주기를 짧게
mgr_purge_enabled=true
mgr_purge_xlog_keep_days=2
mgr_purge_profile_keep_days=2
mgr_purge_counter_keep_days=2
