# 윈도우 exe 를 빌드해 릴리스에 붙인다.
#
# 두 가지로 돈다.
#   · 버전 태그(예: 0.6.1)를 푸시하면
#   · Actions 화면에서 직접 돌리면(workflow_dispatch) — package.json 의 버전으로 태그를 **여기서 만든다.**
#     태그를 푸시할 수 없는 곳(브랜치 하나에만 쓰게 묶인 세션 등)에서 쓴다
#
# 지금까지 릴리스와 같은 모양으로 만든다:
#   · 태그 이름은 숫자만(0.6.1), 릴리스 이름은 v0.6.1
#   · 프리릴리스
#   · 설치본이 아니라 단일 실행 파일 nscouter.exe 하나 (WebView2 는 윈도우 10/11 에 기본으로 있다)
#
# 태그는 package.json · tauri.conf.json · Cargo.toml 의 버전과 같아야 한다 (deploy-guide 6장).
# 다르면 «0.6.1 릴리스에 0.5.13 이라고 적힌 exe» 가 올라가므로 빌드 전에 멈춘다.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 태그와 앱 버전이 같은지 확인
        id: ver
        shell: bash
        run: |
          # 직접 돌렸으면 태그가 아직 없다 — 앱 버전이 곧 태그다
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          for v in \
            "$(node -p "require('./package.json').version")" \
            "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"; do
            if [ "$v" != "$tag" ]; then
              echo "태그 $tag 와 앱 버전 $v 가 다르다"; exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 설치본은 만들지 않는다 — 지금까지 릴리스가 exe 하나였다
      - run: npx tauri build --no-bundle

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          # 직접 돌렸을 때 태그를 이 커밋에 만든다
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.tag }}
          prerelease: true
          files: src-tauri/target/release/nscouter.exe
