[package]
name = "nscouter"
version = "0.3.2"
description = "Nscouter - Modern Scouter Client"
authors = []
edition = "2021"

[lib]
name = "nscouter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
# StackPack 의 본문이 GZIP 이다 (ASIS CompressUtil.doZip). 직접 풀 방법이 없다.
flate2 = "1"

# 실서버 테스트에서 XLog endTime → yyyyMMdd 변환에만 쓴다 (프로덕션 코드는 프론트에서 계산).
[dev-dependencies]
chrono = "0.4"
