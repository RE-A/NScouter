[package]
name = "nscouter"
version = "0.5.11"
description = "Nscouter - Modern Scouter Client"
authors = []
edition = "2021"

[lib]
name = "nscouter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
# StackPack 의 본문이 GZIP 이다 (ASIS CompressUtil.doZip). 직접 풀 방법이 없다.
flate2 = "1"

# 실서버 테스트에서 XLog endTime → yyyyMMdd 변환에만 쓴다 (프로덕션 코드는 프론트에서 계산).
[dev-dependencies]
chrono = "0.4"
# 로그 문턱 시험용. tauri-plugin-log 이 안에서 쓰는 것과 **같은 버전이어야** 뜻이 있다
# (Cargo.lock 고정 0.7.1). 레벨을 런타임에 올릴 수 있는가를 실제 조합으로 확인한다.
fern = "0.7"
