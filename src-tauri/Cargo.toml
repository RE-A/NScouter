[package]
name = "nscouter"
version = "0.9.4"
description = "NScouter - Modern Scouter Client"
authors = []
edition = "2021"

[lib]
name = "nscouter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
# StackPack 의 본문이 GZIP 이다 (ASIS CompressUtil.doZip). 직접 풀 방법이 없다.
flate2 = "1"
# 로컬 MCP 서버 (Claude Code · Cursor 가 붙는다). 앱 안에 Streamable HTTP 로 연다 — `src/mcp/`
rmcp = { version = "3.8", features = ["transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# MCP 서버를 끌 때 쓰는 취소 토큰 (rmcp 가 받는 타입)
tokio-util = "0.7"
# MCP 접속 토큰을 만든다
getrandom = "0.3"
# MCP 에서 «서비스로 묶기» 규칙(설정의 정규식)을 적용한다
regex = "1"
# 로컬 캐시 (콜렉터별 SQLite 한 파일) — `src/cache/`. 라이브러리를 같이 빌드해 PC 에 SQLite 가 없어도 된다
rusqlite = { version = "0.37", features = ["bundled"] }

# 실서버 테스트에서 XLog endTime → yyyyMMdd 변환에만 쓴다 (프로덕션 코드는 프론트에서 계산).
[dev-dependencies]
chrono = "0.4"
# 로그 문턱 시험용. tauri-plugin-log 이 안에서 쓰는 것과 **같은 버전이어야** 뜻이 있다
# (Cargo.lock 고정 0.7.1). 레벨을 런타임에 올릴 수 있는가를 실제 조합으로 확인한다.
fern = "0.7"
